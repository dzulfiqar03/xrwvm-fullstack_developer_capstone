name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r server/requirements.txt
          pip install flake8

      - name: Lint Python
        run: flake8 server --exclude=venv,migrations,node_modules --count --select=E9,F63,F7,F82 --show-source --statistics

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm ci

      - name: Build frontend
        working-directory: server/frontend
        env:
          CI: false
        run: npm run build